name: Build Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Java environment
        run: |
          set -euo pipefail
          echo "JAVA_HOME=${JAVA_HOME:-<not set>}"
          java -version
          JAVA_VER_LINE=$(java -version 2>&1 | head -n 1)
          RAW_VER=$(echo "${JAVA_VER_LINE}" | sed -E 's/.*version "([^"]+)".*/\1/')
          if [ -z "${RAW_VER}" ] || [ "${RAW_VER}" = "${JAVA_VER_LINE}" ]; then
            echo "ERROR: Unable to detect active Java version."
            exit 1
          fi
          MAJOR_VER=$(echo "${RAW_VER}" | awk -F. '{if ($1 == "1") print $2; else print $1}' | sed -E 's/[^0-9].*//')
          if [ -z "${MAJOR_VER}" ] || ! [ "${MAJOR_VER}" -eq "${MAJOR_VER}" ] 2>/dev/null; then
            echo "ERROR: Unable to parse Java major version from '${RAW_VER}'."
            exit 1
          fi
          echo "Active Java major version: ${MAJOR_VER}"
          if [ "${MAJOR_VER}" -lt 17 ]; then
            echo "ERROR: Java 17 or newer is required, but detected Java ${MAJOR_VER}."
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          set -euo pipefail
          KEYTOOL_BIN="${JAVA_HOME}/bin/keytool"
          if [ ! -x "${KEYTOOL_BIN}" ]; then
            KEYTOOL_BIN="keytool"
          fi
          if [ ! -f ./debug.keystore ]; then
            "${KEYTOOL_BIN}" -genkeypair \
              -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -noprompt >/dev/null 2>&1
          fi
          if [ ! -f ./debug.keystore ] || [ ! -s ./debug.keystore ]; then
            echo "ERROR: ./debug.keystore could not be created."
            exit 1
          fi
          echo "Temporary debug keystore ready."

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          set -euo pipefail
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "${APK_PATH}" ] || [ ! -s "${APK_PATH}" ]; then
            echo "ERROR: Expected APK not found or empty at ${APK_PATH}"
            if [ -d "app/build/outputs/apk" ]; then
              echo "APK paths discovered inside app/build/outputs/apk:"
              find app/build/outputs/apk -type f -name "*.apk" || true
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi
          case "${APK_PATH}" in
            *.apk) ;;
            *)
              echo "ERROR: Verified file does not have .apk extension: ${APK_PATH}"
              exit 1
              ;;
          esac
          echo "Verified debug APK: ${APK_PATH}"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          set -euo pipefail
          RELEASE_DIR="$(mktemp -d)"
          DEST_APK="${RELEASE_DIR}/app-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "${DEST_APK}"
          if [ ! -f "${DEST_APK}" ] || [ ! -s "${DEST_APK}" ]; then
            echo "ERROR: Failed to prepare release APK at ${DEST_APK}"
            exit 1
          fi
          echo "asset_path=${DEST_APK}" >> "${GITHUB_OUTPUT}"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_PATH: ${{ steps.prepare_asset.outputs.asset_path }}
        run: |
          set -euo pipefail
          gh --version

          if [ -z "${ASSET_PATH}" ] || [ ! -f "${ASSET_PATH}" ] || [ ! -s "${ASSET_PATH}" ]; then
            echo "ERROR: Prepared APK is missing or empty at: ${ASSET_PATH:-<empty>}"
            exit 1
          fi
          case "${ASSET_PATH}" in
            *.apk) ;;
            *)
              echo "ERROR: Prepared asset does not end with .apk: ${ASSET_PATH}"
              exit 1
              ;;
          esac
          if [ "$(basename "${ASSET_PATH}")" != "app-debug.apk" ]; then
            echo "ERROR: Release asset filename must be app-debug.apk"
            exit 1
          fi

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          NOTES_FILE="$(mktemp)"

          printf '%s\n' \
            "This is an automatically generated debug APK built by GitHub Actions." \
            "" \
            "- **GitHub Actions Run Number:** ${GITHUB_RUN_NUMBER}" \
            "- **GitHub Actions Run Attempt:** ${GITHUB_RUN_ATTEMPT}" \
            "- **Source Commit SHA:** ${GITHUB_SHA}" \
            "- **Intended Use:** Testing only (not a Play Store production release)." \
            "- **Signing:** Signed only with a temporary debug keystore." \
            > "${NOTES_FILE}"

          gh release create "${RELEASE_TAG}" \
            "${ASSET_PATH}" \
            --target "${GITHUB_SHA}" \
            --title "${RELEASE_TITLE}" \
            --notes-file "${NOTES_FILE}" \
            --latest

      - name: Report APK download result
        if: steps.prepare_asset.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_OUTCOME: ${{ steps.publish_release.outcome }}
        run: |
          set -euo pipefail
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          DIRECT_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/app-debug.apk"

          if [ "${RELEASE_OUTCOME}" = "success" ]; then
            gh release view "${RELEASE_TAG}"
            RELEASE_URL=$(gh release view "${RELEASE_TAG}" --json url --jq '.url')
            echo "Release Tag: ${RELEASE_TAG}"
            echo "Release Title: Debug APK Build #${GITHUB_RUN_NUMBER}"
            echo "Release Page URL: ${RELEASE_URL}"
            echo "APK Filename: app-debug.apk"
            echo "Direct APK URL: ${DIRECT_URL}"

            {
              echo "### DIRECT APK DOWNLOAD"
              echo ""
              echo "- **DIRECT APK DOWNLOAD:** ${DIRECT_URL}"
              echo "- **Release Tag:** \`${RELEASE_TAG}\`"
              echo "- **Backup Artifact:** Normal GitHub Actions artifact \`app-debug-apk\` remains available as a backup."
            } >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "::warning::Publishing to GitHub Releases failed."
            echo "The debug APK build succeeded and the GitHub Actions artifact 'app-debug-apk' remains available."
            {
              echo "### GitHub Release Warning"
              echo ""
              echo "- The debug APK build succeeded, and the normal GitHub Actions artifact \`app-debug-apk\` remains available."
              echo "- Publishing to GitHub Releases failed, so the latest-release direct download URL does not contain this build."
            } >> "${GITHUB_STEP_SUMMARY}"
          fi
